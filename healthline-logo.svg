<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <!-- Background subtle glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Main Vibrant Gradient (Emerald Teal to Medical Cyan & Royal Indigo) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Badge -->
  <rect x="10" y="10" width="140" height="140" rx="36" fill="url(#bgGrad)" filter="url(#badgeGlow)"/>
  <rect x="10" y="10" width="140" height="140" rx="36" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Subtle Inner Ambient Halo -->
  <circle cx="80" cy="80" r="50" fill="#06b6d4" fill-opacity="0.06"/>

  <!-- Left Pillar of 'H' with sleek capsule cap -->
  <path d="M 48 42 L 48 118" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Right Pillar of 'H' with sleek capsule cap -->
  <path d="M 112 42 L 112 118" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Crossbar of 'H' transformed into an ECG Pulse / Vital Heartline -->
  <path d="M 48 80 L 66 80 L 73 63 L 83 97 L 91 75 L 97 80 L 112 80" 
        stroke="#ffffff" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Accent Vitality Spark / Glowing Health Dot -->
  <circle cx="83" cy="97" r="3.5" fill="#38bdf8"/>
  <circle cx="73" cy="63" r="3.5" fill="#34d399"/>
</svg>